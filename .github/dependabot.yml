version: 2
updates:
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: monthly
    # Version PRs are off (limit 0). constraints.txt is a lock `make lock`
    # generates, and Dependabot bumps one line of it at a time, which
    # contradicted other pins every time (#26-#29 could not install). Known
    # vulnerabilities are caught by .github/workflows/pip-audit.yml instead.
    open-pull-requests-limit: 0
    # The ML stack is pinned exactly on purpose (see requirements.txt): newer
    # FlagEmbedding/transformers combinations break BGE-M3 encoding, and CI
    # cannot catch it because tests.yml does not install these packages. A
    # green Dependabot PR for them is therefore not evidence of safety.
    ignore:
      - dependency-name: "FlagEmbedding"
      - dependency-name: "transformers"
      - dependency-name: "sentence-transformers"
      - dependency-name: "torch"

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
