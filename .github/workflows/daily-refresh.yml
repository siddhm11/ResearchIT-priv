# Daily data refresh: yesterday's arXiv papers + recent citation counts.
#
# Runs scripts/daily_refresh.py, which writes new papers to the recent-papers
# Qdrant shard and Turso, refreshes citations for the last three months, and
# fails the run if any store disagrees. New papers reach personalised feeds,
# paper pages and similarity the moment they are written; the starter feed and
# keyword search catch up at the next sidecar publish (PHASE7 §8).
#
# OFF until switched on: every job is gated on the repository variable
# DAILY_REFRESH == "on" (Settings > Secrets and variables > Actions > Variables),
# so merging this file runs nothing. It needs these repository secrets:
#   QDRANT_RECENT_URL, QDRANT_RECENT_API_KEY, TURSO_URL, TURSO_DB_TOKEN, S2_API_KEY
#
# Timing: arXiv announces new papers around 00:00 UTC Sunday-Thursday. 02:30 UTC
# gives the listing time to settle. The 3-day lookback makes a weekend or a late
# announcement harmless, and a run that could not finish is caught up automatically:
# Turso's ingest_state records the last day every set was listed to its end, and the
# next run starts from there however long ago that was. Re-runs skip stored papers,
# and point ids come from the arXiv id, so a manual run overlapping this one cannot
# collide with it.
#
# Budget, measured: a run takes 9-77 minutes (26 Oct - 3 Nov). Encoding is the
# smaller part: 1,123 new papers took 15 minutes of it on 2 Nov, inside a 47-minute
# refresh; the rest is the OAI listing (arXiv's rate limits), the writes and the
# citation refresh. A Monday brings about twice a weekday's papers, and at the old
# 60-minute ingest limit 31 Oct and 3 Nov failed before finishing. arXiv also stops
# answering for hours at a time (5 and 6 Nov), and the ingest keeps trying through
# that, so its limit is generous: 240 minutes, plus 20 before it is killed, leaves
# 70 for setup, the lists and citations under the job's 330. The repository is
# public, so the minutes cost nothing.
#
# Catching up after a gap: run it by hand with `today` set to a past day, a
# lookback covering the days since the previous run, and a longer
# `ingest_timeout_min`, then step `today` forward. A GitHub runner encodes about
# 2,400 papers an hour (measured 2026-10-20), and arXiv adds roughly 770 a day in
# the configured categories, so a week is about two hours: today=2026-10-07,
# lookback_days=9, ingest_timeout_min=240. A run that hits its limit keeps every
# page it finished; the next run skips them.

name: Daily refresh

on:
  schedule:
    - cron: "30 2 * * *"
  workflow_dispatch:
    inputs:
      lookback_days:
        description: "Days to look back (re-runs skip stored papers)"
        default: "3"
      today:
        description: "Run as if on this day, YYYY-MM-DD, to catch up in short windows (empty = today)"
        default: ""
      ingest_timeout_min:
        description: "Stop the ingest after this long; finished pages stay stored and the next run continues"
        default: "240"
      skip_citations:
        description: "Skip the citation refresh"
        type: boolean
        default: false

concurrency:
  # Never two refreshes at once; a queued run waits instead of cancelling.
  group: daily-refresh
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  refresh:
    if: vars.DAILY_REFRESH == 'on'
    runs-on: ubuntu-latest
    # A ceiling, not the stall guard: the ingest has its own limit (above) and
    # every network call its own deadline. GitHub allows 360.
    timeout-minutes: 330

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Cache the BGE-M3 model (~2.2 GB)
        uses: actions/cache@v6
        with:
          path: ~/.cache/huggingface
          key: bge-m3-${{ hashFiles('constraints.txt') }}

      - name: Install the encoder stack (pinned by constraints.txt, CPU torch)
        run: |
          python -m pip install --upgrade pip
          pip install torch -c constraints.txt --extra-index-url https://download.pytorch.org/whl/cpu
          pip install FlagEmbedding httpx -c constraints.txt

      - name: Refresh
        env:
          QDRANT_RECENT_URL: ${{ secrets.QDRANT_RECENT_URL }}
          QDRANT_RECENT_API_KEY: ${{ secrets.QDRANT_RECENT_API_KEY }}
          TURSO_URL: ${{ secrets.TURSO_URL }}
          TURSO_DB_TOKEN: ${{ secrets.TURSO_DB_TOKEN }}
          S2_API_KEY: ${{ secrets.S2_API_KEY }}
          INGEST_DEVICE: cpu
          TODAY: ${{ inputs.today }}     # through env, never pasted into the script
          INGEST_TIMEOUT_MIN: ${{ inputs.ingest_timeout_min || '240' }}
        run: |
          python scripts/daily_refresh.py \
            --lookback-days "${{ inputs.lookback_days || '3' }}" \
            --ingest-timeout-min "$INGEST_TIMEOUT_MIN" \
            ${TODAY:+--today "$TODAY"} \
            ${{ inputs.skip_citations && '--skip-citations' || '' }}
