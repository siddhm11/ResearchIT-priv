[pytest]
asyncio_mode = auto
testpaths = tests

# Registered so an unknown-marker warning never hides a real one.
#   live    -- hits a real external service (Qdrant, Zilliz, Groq, Turso, arXiv).
#              CI runs `-m "not live"`; run these against a deploy instead.
#   browser -- drives a real browser via playwright.
markers =
    live: requires network access and live cloud credentials
    browser: requires playwright and a running server
