<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="ResearchIT — AI-powered arXiv paper recommendations. Search, save, and discover research tailored to your interests." />
  <title>{% block title %}ResearchIT{% endblock %}</title>

  <!-- TailwindCSS + DaisyUI (CDN, no build step) -->
  <link href="https://cdn.jsdelivr.net/npm/daisyui@4.12.10/dist/full.min.css" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Custom styles -->
  <link rel="stylesheet" href="/static/styles.css" />

  <!-- HTMX -->
  <script src="https://unpkg.com/htmx.org@1.9.12"></script>

  <style>
    /* Spinner shown while HTMX request is in-flight */
    .htmx-request .htmx-indicator { display: inline-block !important; }
    .htmx-indicator { display: none; }
  </style>

  <!-- Theme toggle script (runs before body to prevent flash) -->
  <script>
    (function() {
      const saved = localStorage.getItem('researchit-theme');
      if (saved) {
        document.documentElement.setAttribute('data-theme', saved);
      }
    })();
  </script>
</head>
<body class="bg-base-200 min-h-screen">

  <!-- Navbar -->
  <nav class="navbar navbar-glass sticky top-0 z-50 px-4 md:px-6">
    <div class="flex-1">
      <a href="/" class="flex items-center gap-2 text-xl">
        <span class="brand-text">ResearchIT</span>
      </a>
    </div>
    
    <!-- Desktop Menu -->
    <div class="hidden md:flex flex-none items-center gap-1">
      <a href="/" class="btn btn-ghost btn-sm">Home</a>
      <a href="/search" class="btn btn-ghost btn-sm">Search</a>
      <a href="/saved" class="btn btn-ghost btn-sm">Saved</a>
      <!-- Theme toggle -->
      <button id="theme-toggle" class="btn btn-ghost btn-sm btn-circle ml-2" title="Toggle theme"
              onclick="toggleTheme()">
        <span id="theme-icon-dark" class="hidden">☀️</span>
        <span id="theme-icon-light" class="hidden">🌙</span>
      </button>
    </div>

    <!-- Mobile Menu Toggle -->
    <div class="flex-none md:hidden">
      <label class="btn btn-ghost btn-sm btn-circle swap swap-rotate">
        <input type="checkbox" class="mobile-menu-toggle hidden" />
        <svg class="swap-off fill-current" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 512 512"><path d="M64,384H448V341.33H64Zm0-106.67H448V234.67H64ZM64,128v42.67H448V128Z"/></svg>
        <svg class="swap-on fill-current" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 512 512"><polygon points="400 145.49 366.51 112 256 222.51 145.49 112 112 145.49 222.51 256 112 366.51 145.49 400 256 289.49 366.51 400 400 366.51 289.49 256 400 145.49"/></svg>
      </label>
      <!-- Mobile Menu Dropdown -->
      <div class="mobile-menu hidden">
        <a href="/" class="btn btn-ghost justify-start">Home</a>
        <a href="/search" class="btn btn-ghost justify-start">Search</a>
        <a href="/saved" class="btn btn-ghost justify-start">Saved</a>
        <div class="divider my-1"></div>
        <button class="btn btn-ghost justify-start" onclick="toggleTheme()">
          <span class="theme-text-dark hidden">Switch to Light Mode ☀️</span>
          <span class="theme-text-light hidden">Switch to Dark Mode 🌙</span>
        </button>
      </div>
    </div>
  </nav>

  <!-- Main content -->
  <main class="container mx-auto px-4 py-6 md:py-8 max-w-4xl min-h-[70vh]">
    {% block content %}{% endblock %}
  </main>

  <footer class="app-footer">
    <div class="container mx-auto px-4 max-w-4xl">
      <p>Built with ❤️ — <span class="brand-text font-semibold">ResearchIT</span></p>
      <p class="mt-2 text-xs opacity-60">AI-powered arXiv recommendations using Qdrant, Zilliz & Turso.</p>
    </div>
  </footer>

  <!-- Theme toggle logic -->
  <script>
    function toggleTheme() {
      const html = document.documentElement;
      const current = html.getAttribute('data-theme');
      const next = current === 'dark' ? 'light' : 'dark';
      html.setAttribute('data-theme', next);
      localStorage.setItem('researchit-theme', next);
      updateThemeIcon();
    }

    function updateThemeIcon() {
      const theme = document.documentElement.getAttribute('data-theme');
      
      // Desktop icons
      const iconDark = document.getElementById('theme-icon-dark');
      const iconLight = document.getElementById('theme-icon-light');
      if (iconDark) iconDark.classList.toggle('hidden', theme !== 'dark');
      if (iconLight) iconLight.classList.toggle('hidden', theme !== 'light');
      
      // Mobile menu text
      document.querySelectorAll('.theme-text-dark').forEach(el => el.classList.toggle('hidden', theme !== 'dark'));
      document.querySelectorAll('.theme-text-light').forEach(el => el.classList.toggle('hidden', theme !== 'light'));
    }

    // Set icon on load
    updateThemeIcon();
  </script>

</body>
</html>
