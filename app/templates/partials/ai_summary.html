{# Partial: AI Summary Card #}
{% if summary_html %}
<div class="ai-summary-card mb-6">

      <path fill-rule="evenodd" d="M11.3 1.046A1 1 0 0112 2v5h4a1 1 0 01.82 1.573l-7 10A1 1 0 018 18v-5H4a1 1 0 01-.82-1.573l7-10a1 1 0 011.12-.38z" clip-rule="evenodd" />
    </svg>
    <span class="font-semibold text-sm brand-text">AI Overview</span>
  </div>
  <div class="text-sm text-base-content/90 leading-relaxed typewriter">
    {{ summary_html | safe }}
  </div>
  <div class="mt-3 flex justify-end">
    <span class="text-[10px] text-base-content/40 uppercase tracking-wide">Powered by Groq</span>
  </div>
</div>
{% endif %}
