{# Shown when there is nothing to recommend yet. #}
<div class="empty">
  <p class="empty-title">Nothing here yet</p>
  <p class="empty-body">
    Save {{ min_saves | default(1) }} paper{{ "s" if (min_saves | default(1)) > 1 else "" }} and
    this feed starts building itself around what you read. It gets noticeably
    better at five.
  </p>
  <div class="row" style="justify-content:center;padding-top:.4rem">
    <a href="/search" class="btn btn-primary btn-sm">Find papers</a>
    <button type="button" class="btn btn-quiet btn-sm"
            hx-get="/api/recommendations"
            hx-target="#rec-section"
            hx-swap="innerHTML">Check again</button>
  </div>
</div>
